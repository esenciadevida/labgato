name: LabGato CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    name: PHP 8.4 & MySQL Tests
    runs-on: ubuntu-latest

    # Spin up a real MySQL 8.0 database for testing
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: labgato_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP with required extensions
      #    The locked dependencies (laravel/framework v13, symfony v8.1) require PHP >= 8.4.1.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, zip, bcmath
          coverage: none

      # 3. Setup Node.js for frontend asset building
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Install Composer dependencies (cached for speed)
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # 5. Install NPM dependencies and build Vite assets
      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      # 6. Prepare the Laravel Environment for CI
      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

          # Inject CI MySQL credentials into .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=labgato_testing/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root_password/' .env

          # Ensure external services don't fire during tests
          sed -i 's/MAIL_MAILER=.*/MAIL_MAILER=log/' .env
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env

      # 7. Run Migrations (Verifies the schema works on MySQL)
      - name: Run Database Migrations
        run: php artisan migrate --force

      # 8. Run the Test Suite
      - name: Run Tests
        run: php artisan test
